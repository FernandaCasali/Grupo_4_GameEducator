services:

  db:
    image: postgres:16-alpine
    container_name: gamificacao-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gamificacaodb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: gamificacao-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

  app:
    build: ./backend
    container_name: gamificacao-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: gamificacaodb
      DB_USER: postgres
      DB_PASSWORD: postgres
      IA_SERVICE_URL: http://ia-service:8000
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  # B1 / Desafio 3: servico Python de IA. Se parar (docker compose stop ia-service),
  # o Core continua funcionando e /recomendacoes responde em modo degradado.
  ia-service:
    build: ./ia-service
    container_name: gamificacao-ia
    restart: unless-stopped
    ports:
      - "8000:8000"

  # B1 / Desafio 5: broker MQTT para os dispositivos dos laboratorios (config de laboratorio: sem TLS).
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: gamificacao-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./iot-gateway/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data

  # B1 / Desafio 5: gateway MQTT -> Core. Se parar (docker compose stop iot-gateway), o broker
  # guarda os eventos (sessao persistente + QoS 1) e os entrega quando o gateway voltar.
  iot-gateway:
    build: ./iot-gateway
    container_name: gamificacao-iot-gateway
    restart: unless-stopped
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      CORE_URL: http://app:8080
    depends_on:
      - mosquitto
      - app

volumes:
  postgres_data:
  mosquitto_data:
