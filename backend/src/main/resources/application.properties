spring.application.name=Grupo_4_GameEducator

spring.datasource.url=jdbc:h2:mem:gamificacaodb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# B1 / Desafio 3 - servico Python de IA
ia.service.url=${IA_SERVICE_URL:http://localhost:8000}
ia.service.timeout-ms=1500

# B1 / Desafio 4 - laboratorio de falha do consumidor de notificacoes
notificacoes.simular-falha=false

# D6 - Observabilidade (Actuator + Prometheus)
# /actuator/prometheus e o endereco que o Prometheus le a cada 5s
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
# Histograma das requisicoes HTTP: permite p50/p95 de latencia por endpoint no Grafana
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Metricas de negocio usam o registro global do Micrometer (Metrics.counter)
management.metrics.use-global-registry=true
